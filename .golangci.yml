# Talon golangci-lint v2 configuration
# Strict but practical for an existing codebase.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  sort-results: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - unconvert
    - whitespace
    - gocritic
    - nakedret

  settings:
    staticcheck:
      checks: ["all"]
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*sql.Rows).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - ifElseChain

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anubhavg-icpl/talon

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
