# =============================================================================
# Talon — docker-compose.yml (production-ready, single file)
# =============================================================================
# One file opens the entire stack:
#
#   docker compose up -d --build                     # core stack
#   docker compose --profile vuln up -d --build      # + lab target
#   docker compose --profile ollama up -d             # + local Ollama LLM
#   docker compose --profile slm up -d --build onnx-slm  # + local SLM
#   docker compose --profile proxy up -d              # + Caddy TLS reverse proxy
#
# Every service has: healthcheck, resource limits, log rotation, restart
# policy, and security constraints applied to the maximum extent the image
# allows. See docs/ARCHITECTURE.md and docs/DEPLOYMENT.md for rationale.
#
# All secrets use ${VAR:?error} — compose fails fast if any is unset.
# Copy .env.example → .env (or secrets.env) and fill in real values.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared env anchor: single source of truth for talon-core + talon-relay.
# -----------------------------------------------------------------------------
x-talon-env: &talon-env
  HEXSTRIKE_SERVER_URL: http://localhost:${HEXSTRIKE_PORT:-8888}
  LIGHTPANDA_MCP_PATH: ${LIGHTPANDA_MCP_PATH:-/usr/local/bin/lightpanda}
  MSF_SERVER: localhost
  MSF_PORT: ${MSF_PORT:-5554}
  MSF_PASSWORD: ${MSF_PASSWORD:?MSF_PASSWORD must be set}
  MSF_SSL: ${MSF_SSL:-true}
  LHOST: ${LHOST:-127.0.0.1}
  LPORT: ${LPORT:-4444}
  LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
  LLM_CODE_PROVIDER: ${LLM_CODE_PROVIDER:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}
  OPENAI_HTTP_TIMEOUT: ${OPENAI_HTTP_TIMEOUT:-120s}
  TALON_RUN_TIMEOUT: ${TALON_RUN_TIMEOUT:-20m}
  OLLAMA_URL: http://localhost:${OLLAMA_PORT:-11434}
  AMQP_URL: ${AMQP_URL:?AMQP_URL must be set}
  TALON_DATABASE_URL: ${TALON_DATABASE_URL:?TALON_DATABASE_URL must be set}
  TALON_ADMIN_USERNAME: ${TALON_ADMIN_USERNAME:-admin}
  TALON_ADMIN_PASSWORD: ${TALON_ADMIN_PASSWORD:?TALON_ADMIN_PASSWORD must be set}
  TALON_AUTH_DISABLED: ${TALON_AUTH_DISABLED:-false}
  REDIS_URL: redis://localhost:${REDIS_PORT:-6380}
  OLLAMA_MAIN_MODEL: ${OLLAMA_MAIN_MODEL:-talon}
  OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-talon}
  OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-talon}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MAIN_MODEL: ${OPENAI_MAIN_MODEL:-glm-5.2}
  OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-glm-5.2}
  OPENAI_CODE_MODEL: ${OPENAI_CODE_MODEL:-glm-5.2}
  ONNX_BASE_URL: ${ONNX_BASE_URL:-http://localhost:8090/v1}
  ONNX_API_KEY: ${ONNX_API_KEY:-talon-local}
  ONNX_MAIN_MODEL: ${ONNX_MAIN_MODEL:-smollm}
  ONNX_JUDGE_MODEL: ${ONNX_JUDGE_MODEL:-smollm}
  ONNX_CODE_MODEL: ${ONNX_CODE_MODEL:-smollm}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  # Prod: set TZ for consistent timestamps in logs and DB records.
  TZ: ${TZ:-UTC}

# -----------------------------------------------------------------------------
# Reusable anchors — applied to every service where the image allows it.
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

# Maximum sandbox: drop ALL capabilities, forbid privilege escalation.
# Only usable by services that don't need root or special kernel access.
x-sandbox: &sandbox-safety
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Common deploy limits template (overridden per service with actual values).
x-deploy-defaults: &deploy-defaults
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
    window: 120s

# -----------------------------------------------------------------------------
# Named volumes for persistent data (survive container recreation).
# -----------------------------------------------------------------------------
volumes:
  pg_data:
    driver: local
  rabbitmq_data:
    driver: local
  ollama_data:
    driver: local
  talon_data:
    driver: local
  msf_data:
    driver: local
  msf_payloads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# -----------------------------------------------------------------------------
# Networks — all services on host network (by design: reverse shells, MSF RPC,
# ttyd loopback proxy, distinct localhost ports per service).
# See docs/ARCHITECTURE.md §3 for why host networking is required.
# -----------------------------------------------------------------------------

services:
  # ===========================================================================
  # 0. LAB TARGET — CVE-2011-2523 (vsftpd 2.3.4 backdoor). Profile: vuln.
  # NEVER deploy in production. Lab/isolated network only.
  # ===========================================================================
  vuln-target:
    build:
      context: ./vuln-target
      dockerfile: Dockerfile
      target: ${VULN_TARGET:-real}
    image: ${VULN_TARGET_IMAGE:-talon-vuln-target}
    container_name: talon_vuln_target
    profiles: ["vuln"]
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

  # ===========================================================================
  # 1. METASPLOIT RPC — msfrpcd on Kali. Strike MCP connects via HTTPS msgpack.
  # ===========================================================================
  metasploit:
    build:
      context: ./kali-msf
    image: ${MSF_IMAGE:-talon-msf-rpc}
    container_name: msf_rpc
    environment:
      MSF_PORT: ${MSF_PORT:-5554}
      MSF_PASSWORD: ${MSF_PASSWORD:?MSF_PASSWORD must be set}
      MSF_SSL: ${MSF_SSL:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - msf_data:/root/.msf4
      - msf_payloads:/payloads
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # msfrpcd runs as root in Kali image; cannot drop caps or set user.
    # Healthcheck: TCP port probe (no HTTP endpoint).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/${MSF_PORT:-5554} && echo -e '' >&3 && cat <&3 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MSF_MEMORY_LIMIT:-2g}
          cpus: "${MSF_CPU_LIMIT:-2.0}"
        reservations:
          memory: 512m

  # ===========================================================================
  # 2. ARSENAL ENGINE — BlackArch tool runner (nmap, nuclei, sqlmap, ...).
  #    Contracts: :8888 HTTP API, :7681 ttyd /shell (SSO via talon-core).
  #    MUST be privileged: security tools need CAP_NET_RAW, CAP_NET_ADMIN,
  #    CAP_SYS_ADMIN for raw sockets, packet capture, mount, etc.
  # ===========================================================================
  arsenal-engine:
    build:
      context: ./arsenal-engine
    image: ${ARSENAL_IMAGE:-talon-arsenal-engine}
    container_name: arsenal_engine
    privileged: true
    environment:
      API_PORT: ${HEXSTRIKE_PORT:-8888}
      TTYD_PORT: ${TTYD_PORT:-7681}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    # Healthcheck inherited from Dockerfile (GET /health on :8888).
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${ARSENAL_MEMORY_LIMIT:-4g}
          cpus: "${ARSENAL_CPU_LIMIT:-3.0}"
        reservations:
          memory: 1g

  # ===========================================================================
  # 3. RABBITMQ — message broker for talon-relay. Queue: execute_agent_task.
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: talon_rabbitmq
    hostname: ${RABBITMQ_HOSTNAME:-talon-rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-talon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: ${TZ:-UTC}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    # RabbitMQ entrypoint needs these to create dirs and switch user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1g}
          cpus: "${RABBITMQ_CPU_LIMIT:-1.5}"
        reservations:
          memory: 256m

  # ===========================================================================
  # 3b. POSTGRES — run history, dashboard users, auth sessions, runtime config.
  #     Replaces runs.json fallback when TALON_DATABASE_URL is set.
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: talon_postgres
    environment:
      POSTGRES_USER: talon
      POSTGRES_PASSWORD: ${TALON_PG_PASSWORD:?TALON_PG_PASSWORD must be set}
      POSTGRES_DB: talon
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
      TZ: ${TZ:-UTC}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    # Postgres entrypoint needs these to chown its data dir and switch user
    # from root to the postgres user inside the container.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talon -d talon"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Postgres tuning via env (see docs/DEPLOYMENT.md §4.2).
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-384MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "log_min_duration_statement=${PG_SLOW_QUERY_MS:-1000}"
      - "-c"
      - "checkpoint_completion_target=${PG_CHECKPOINT_TARGET:-0.9}"
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-1g}
          cpus: "${PG_CPU_LIMIT:-1.5}"
        reservations:
          memory: 256m

  # ===========================================================================
  # 3c. REDIS — cache layer (health probes 5s, AI analysis 24h, sessions 60s).
  #     Port 6380 (avoids conflict with host Redis on 6379).
  #     Pure cache: no persistence. Core runs uncached if Redis is down.
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: talon_redis
    command:
      - "redis-server"
      - "--port"
      - "${REDIS_PORT:-6380}"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-200mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--timeout"
      - "300"
      - "--tcp-keepalive"
      - "60"
      - "--loglevel"
      - "${REDIS_LOGLEVEL:-notice}"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    environment:
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    user: "redis:redis"
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6380}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: 64m

  # ===========================================================================
  # 4. OLLAMA — optional local LLM runtime. Profile: ollama.
  #    Only needed when LLM_PROVIDER=ollama or LLM_CODE_PROVIDER=ollama.
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: talon_ollama
    profiles: ["ollama"]
    environment:
      TZ: ${TZ:-UTC}
      OLLAMA_HOST: 0.0.0.0:${OLLAMA_PORT:-11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8g}
          cpus: "${OLLAMA_CPU_LIMIT:-4.0}"
        reservations:
          memory: 1g

  # ===========================================================================
  # 4b. ONNX / SmolLM SLM — ultra-fast local chat, OpenAI-compatible SSE.
  #     Profile: slm. See docs/slm-onnx.md.
  # ===========================================================================
  onnx-slm:
    build:
      context: ./onnx-slm
      dockerfile: Dockerfile
    image: ${ONNX_SLM_IMAGE:-talon-onnx-slm:latest}
    container_name: talon_onnx_slm
    profiles: ["slm"]
    environment:
      SLM_PORT: ${SLM_PORT:-8090}
      SLM_MODEL_ID: ${SLM_MODEL_ID:-HuggingFaceTB/SmolLM2-360M-Instruct}
      SLM_FALLBACK_MODEL_ID: ${SLM_FALLBACK_MODEL_ID:-HuggingFaceTB/SmolLM2-135M-Instruct}
      SLM_BACKEND: ${SLM_BACKEND:-auto}
      SLM_MAX_NEW_TOKENS: ${SLM_MAX_NEW_TOKENS:-256}
      SLM_TEMPERATURE: ${SLM_TEMPERATURE:-0.3}
      SLM_LAZY: ${SLM_LAZY:-0}
      MODEL_DIR: /models/smollm
      HF_HOME: /models/hf-cache
      TRANSFORMERS_CACHE: /models/hf-cache
      ORT_INTRA_THREADS: ${ORT_INTRA_THREADS:-4}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      TZ: ${TZ:-UTC}
    volumes:
      - ./models/smollm:/models/smollm
      - ./models/hf-cache:/models/hf-cache
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SLM_PORT:-8090}/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${SLM_MEMORY_LIMIT:-4g}
          cpus: "${SLM_CPU_LIMIT:-3.0}"
        reservations:
          memory: 512m

  # ===========================================================================
  # 5. TALON-CORE — HTTP control plane (:8000) + orchestrator.
  #    Mounts docker.sock for Forge (codegen sandbox). Runs as root because
  #    the Dockerfile doesn't switch users yet (roadmap: non-root USER).
  # ===========================================================================
  talon-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TALON_IMAGE:-talon:latest}
    container_name: talon_core
    command: ["/app/talon-core"]
    environment:
      <<: *talon-env
      TALON_DATA_DIR: /data
      TTYD_URL: http://127.0.0.1:${TTYD_PORT:-7681}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - talon_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      metasploit:
        condition: service_healthy
      arsenal-engine:
        condition: service_started
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Core cannot use cap_drop: ALL — Forge needs Docker socket access.
    # It cannot run read_only — writes to /data (run state) and temp files.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${CORE_MEMORY_LIMIT:-2g}
          cpus: "${CORE_CPU_LIMIT:-2.0}"
        reservations:
          memory: 512m
    # Stop grace period: allow in-flight HTTP requests to complete.
    stop_grace_period: 30s

  # ===========================================================================
  # 6. TALON-RELAY — same platform image, AMQP queue worker.
  #    Scale horizontally: docker compose up -d --scale talon-relay=3
  # ===========================================================================
  talon-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TALON_IMAGE:-talon:latest}
    container_name: talon_relay
    command: ["/app/talon-relay"]
    environment:
      <<: *talon-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      metasploit:
        condition: service_healthy
      arsenal-engine:
        condition: service_started
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Relay is a queue worker with no HTTP port; liveness = process alive.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x talon-relay >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${RELAY_MEMORY_LIMIT:-2g}
          cpus: "${RELAY_CPU_LIMIT:-2.0}"
        reservations:
          memory: 512m
    stop_grace_period: 30s

  # ===========================================================================
  # 7. DASHBOARD — Next.js ops console (:3000).
  #    Browser → dashboard → /api/talon/* proxy → talon-core :8000.
  #    Session auth via talon-core. No direct core exposure to browser.
  # ===========================================================================
  dashboard:
    build:
      context: ./web
    image: ${DASHBOARD_IMAGE:-talon-dashboard}
    container_name: talon_dashboard
    environment:
      TALON_CORE_URL: http://localhost:8000
      PORT: ${DASHBOARD_PORT:-3000}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      # Next.js telemetry off in prod.
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      talon-core:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    user: "node:node"
    read_only: true
    tmpfs:
      - /tmp
      - /.next/cache
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${DASHBOARD_PORT:-3000}/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${DASHBOARD_MEMORY_LIMIT:-512m}
          cpus: "${DASHBOARD_CPU_LIMIT:-1.0}"
        reservations:
          memory: 128m

  # ===========================================================================
  # 8. CADDY — TLS reverse proxy (automatic HTTPS via Let's Encrypt).
  #    Profile: proxy. Terminates TLS for the dashboard, forwards to :3000.
  #    Also provides a hardened public entry point with security headers,
  #    rate limiting, and gzip compression.
  #
  #    Set TALON_DOMAIN in .env (e.g. talon.example.com) to enable.
  #    For local testing without a domain, Caddy uses self-signed certs.
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: talon_caddy
    profiles: ["proxy"]
    environment:
      TALON_DOMAIN: ${TALON_DOMAIN:-localhost}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      TALON_CORE_PORT: 8000
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      TZ: ${TZ:-UTC}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    network_mode: host
    <<: *sandbox-safety
    user: "caddy:caddy"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}
          cpus: "${CADDY_CPU_LIMIT:-0.5}"
        reservations:
          memory: 64m
    command: >
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
